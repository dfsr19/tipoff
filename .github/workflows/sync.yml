name: Quoten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync ausführen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node sync.js
      - name: Änderungen committen
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Quoten aktualisiert"
          git push

