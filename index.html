<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="description" content="Tipoff — Tippspiel für Freundesrunden. Bundesliga, UFC und eigene Ligen.">
<title>Tipoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090B;         /* Kopf, tiefster Grund */
  --surface:#101317;    /* Inhaltsfläche, etwas heller */
  --card:#181C22;
  --raise:#212630;
  --line:#2A303A;
  --line-2:#363E4A;
  --text:#F3F5F7;
  --muted:#8A939E;
  --blue:#50AAF0;
  --blue-dk:#2B7FC4;
  --blue-gl:rgba(80,170,240,.14);
  --win:#34D399;
  --warn:#FBBF24;
  --bad:#F87171;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#000;color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{
  width:100%;max-width:480px;min-height:100vh;background:var(--surface);
  display:flex;flex-direction:column;position:relative;overflow-x:hidden;
}

/* ═══════ LADESCREEN ═══════ */
#splash{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;
  transition:opacity .55s ease}
#splash.gone{opacity:0;pointer-events:none}
.smark{position:relative;z-index:2;width:min(72vw,380px);height:auto;
  transition:opacity .4s;opacity:0;pointer-events:none}
.smark.show{opacity:1}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
  opacity:0;transition:opacity .35s}
#vid.on{opacity:1}
.sload{position:absolute;bottom:14%;width:120px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.14);overflow:hidden;z-index:2}
.sload i{display:block;height:100%;width:38%;background:var(--blue);border-radius:2px;
  animation:sSlide 1.15s infinite ease-in-out}
@keyframes sSlide{from{transform:translateX(-110%)}to{transform:translateX(380%)}}

/* ═══════ WORTMARKE ═══════ */
.mark{display:block;height:26px;width:auto}
.hrow .mark{height:30px}
.logobtn{background:none;border:none;padding:4px 2px;margin:-4px -2px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}

/* ═══════ KOPF ═══════ */
header{background:var(--bg);padding:16px 16px 18px;position:relative;
  border-bottom:1px solid var(--line)}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.35}
.hrow{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;flex-shrink:0;border:1px solid var(--line-2);border-radius:12px;
  display:grid;place-items:center;background:var(--raise);transition:background .15s}
.ico:active{background:var(--line)}
.ico.b{background:var(--blue);border-color:var(--blue);color:#04121F;font-weight:700}
.burger{display:flex;flex-direction:column;gap:3.5px;align-items:center}
.burger i{width:16px;height:2px;background:var(--text);border-radius:2px}
.sub{font-size:12px;color:var(--muted);margin-top:10px;font-weight:500}
.htitle{font-family:'Poppins';font-weight:700;font-size:20px;line-height:1.2}
.hsub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ═══════ MENÜ ═══════ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;animation:fade .2s;
  backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:320px;background:var(--bg);
  z-index:91;border-left:1px solid var(--line);display:flex;flex-direction:column;
  animation:slideIn .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
@keyframes slideIn{from{transform:translateX(100%)}}
.dhead{padding:22px 18px 18px;border-bottom:1px solid var(--line)}
.avatar{width:50px;height:50px;border-radius:15px;background:var(--blue);color:#04121F;
  display:grid;place-items:center;font-family:'Poppins';font-weight:800;font-size:21px}
.dname{font-family:'Poppins';font-weight:700;font-size:17px;margin-top:11px}
.dmail{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-all}
.dnav{padding:10px 10px 20px;flex:1}
.dgrp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#5C6672;padding:15px 10px 7px}
.ditem{width:100%;display:flex;align-items:center;gap:13px;padding:12px 10px;border-radius:11px;
  font-size:14.5px;font-weight:500;text-align:left}
.ditem:active{background:var(--card)}
.ditem .em{width:24px;text-align:center;font-size:16px;flex-shrink:0}
.ditem .tag{margin-left:auto;font-size:10px;font-weight:700;background:var(--blue);
  color:#04121F;padding:2px 7px;border-radius:20px}
.ditem.red{color:var(--bad)}

/* ═══════ REITER ═══════ */
nav{display:flex;gap:5px;padding:9px 12px;background:var(--bg);position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--line)}
nav button{flex:1;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;
  padding:9px 2px;transition:all .15s}
nav button[aria-selected="true"]{background:var(--blue-gl);color:var(--blue)}

main{flex:1;padding:16px 14px 110px}
.sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:24px 3px 11px;display:flex;align-items:center;gap:9px}
.sec:first-child{margin-top:2px}
.sec .ln{flex:1;height:1px;background:var(--line)}

/* ═══════ BAUSTEINE ═══════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.btn{width:100%;border-radius:13px;background:var(--blue);color:#04121F;font-weight:700;
  font-size:15px;padding:15px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--raise);color:var(--text);border:1px solid var(--line-2)}
.btn.dark{background:var(--bg);color:var(--text);border:1px solid var(--line-2)}
.btn.red{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.35)}
.btn:disabled{background:var(--raise);color:#5C6672;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 9px;
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--raise);border:1px solid var(--line-2);color:var(--muted)}
.pill.b{background:var(--blue-gl);border-color:rgba(80,170,240,.35);color:var(--blue)}
.pill.g{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.3);color:var(--win)}
.pill.solid{background:var(--blue);border-color:var(--blue);color:#04121F}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:10px}
.hint b{color:var(--text);font-weight:600}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin:16px 0 7px}
input[type=text],input[type=password],input[type=email],textarea,select{
  width:100%;background:var(--raise);border:1px solid var(--line-2);border-radius:12px;
  padding:13px;font-size:15px;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--blue);outline:none}
input::placeholder,textarea::placeholder{color:#5C6672}
textarea{min-height:88px;resize:vertical;line-height:1.55}
.err{display:none;color:var(--bad);font-size:12.5px;font-weight:600;margin-top:12px;
  background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);
  border-radius:10px;padding:10px 12px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:var(--raise);border:1px solid var(--line-2);border-radius:20px;
  padding:7px 12px;font-size:12.5px;font-weight:500;display:flex;gap:7px;align-items:center}
.chip button{color:var(--muted);font-size:15px;line-height:1}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;line-height:1.65}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--raise);
  border:1px solid var(--line-2);border-radius:24px;padding:11px 20px;font-size:13.5px;
  font-weight:600;z-index:150;box-shadow:0 8px 28px rgba(0,0,0,.5);animation:tUp .28s;max-width:90%}
@keyframes tUp{from{opacity:0;transform:translate(-50%,12px)}}

/* ═══════ AUTH ═══════ */
.authwrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:32px 22px;background:radial-gradient(120% 55% at 50% 0%,rgba(80,170,240,.1),transparent 62%),var(--surface)}
.authwrap .mark{height:38px;margin:0 auto 9px}
.authtag{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:30px}
.seg{display:flex;background:var(--raise);border:1px solid var(--line-2);border-radius:13px;
  padding:4px;margin-bottom:6px}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--blue);color:#04121F}
.legalnote{text-align:center;font-size:11.5px;color:#5C6672;line-height:1.6;margin-top:18px}
.linklike{display:block;margin:0 auto;background:none;border:none;color:var(--blue);
  font-size:13.5px;text-decoration:underline;cursor:pointer;padding:2px}
.legalnote button{color:var(--muted);text-decoration:underline;font-size:11.5px}

/* ═══════ WILLKOMMEN ═══════ */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 26px;text-align:center;
  background:radial-gradient(110% 50% at 50% 22%,rgba(80,170,240,.16),transparent 65%),var(--surface)}
.wring{width:88px;height:88px;border-radius:50%;background:var(--blue-gl);
  border:1px solid rgba(80,170,240,.35);display:grid;place-items:center;font-size:38px;
  margin-bottom:26px;animation:wPop .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes wPop{from{opacity:0;transform:scale(.6)}}
.welcome h1{font-family:'Poppins';font-weight:700;font-size:27px;line-height:1.25;
  animation:wUp .5s .12s backwards}
.welcome .slogan{font-family:'Poppins';font-weight:700;font-size:21px;color:var(--blue);
  margin-top:12px;animation:wUp .5s .24s backwards}
.welcome p{color:var(--muted);font-size:14px;line-height:1.65;margin-top:18px;max-width:330px;
  animation:wUp .5s .36s backwards}
.welcome .btn{margin-top:34px;max-width:330px;animation:wUp .5s .48s backwards}
@keyframes wUp{from{opacity:0;transform:translateY(14px)}}

/* ═══════ RUNDEN-KACHEL ═══════ */
.round{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px;margin-bottom:11px;display:block;transition:all .15s}
.round:active{transform:scale(.99);border-color:var(--line-2)}
.round .top{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.round .nm{font-family:'Poppins';font-weight:700;font-size:16.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.round .arw{margin-left:auto;color:var(--muted);font-size:18px;flex-shrink:0}
.round .row{display:flex;gap:20px}
.round .row div{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;
  letter-spacing:.06em}
.round .row b{display:block;font-family:'Poppins';font-size:17px;font-weight:700;color:var(--text);
  margin-bottom:2px;letter-spacing:-.01em}
.round .row b.hot{color:var(--blue)}
.round.dash{background:transparent;border-style:dashed;color:var(--muted)}
.round.dash .nm{color:var(--text)}

/* ═══════ WETTBEWERBS-AUSWAHL ═══════ */
.complist{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.compbar{width:100%;height:76px;display:flex;align-items:center;gap:13px;text-align:left;
  background-color:var(--card);background-size:cover;background-position:center;
  border:1px solid var(--line);border-radius:var(--r);padding:0 16px;transition:all .15s;
  position:relative;overflow:hidden}
.compbar:active{transform:scale(.99);border-color:var(--line-2)}
.compbar .ctxt{flex:1;min-width:0}
.compbar .ctxt b{font-family:'Poppins';font-weight:800;font-size:17px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.compbar .arw{color:#fff;font-size:19px;flex-shrink:0}
.compbar .ctag{font-size:10.5px;font-weight:700;color:#F0D9A8;text-transform:uppercase;
  letter-spacing:.04em;display:flex;align-items:center;gap:5px;flex-shrink:0;
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
.compbar.locked{opacity:.88}

/* ═══════ TEILEN ═══════ */
.share{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:linear-gradient(135deg,rgba(80,170,240,.13),rgba(80,170,240,.04));
  border:1px solid rgba(80,170,240,.28);border-radius:var(--r);padding:14px;margin-bottom:12px}
.share .ic{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#04121F;
  display:grid;place-items:center;font-size:17px;flex-shrink:0}
.share b{display:block;font-size:14.5px;font-weight:600}
.share small{font-size:11.5px;color:var(--muted)}

/* ═══════ PREMIUM ═══════ */
.promo{border-radius:18px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#152436,#0C1219 60%);border:1px solid rgba(80,170,240,.3)}
.promo::before{content:'';position:absolute;top:-45%;right:-25%;width:78%;height:150%;
  background:radial-gradient(circle,rgba(80,170,240,.22),transparent 68%)}
.promo>*{position:relative;z-index:2}
.promo h2{font-family:'Poppins';font-weight:700;font-size:22px;line-height:1.3;margin:12px 0 8px}
.promo h2 em{color:var(--blue);font-style:normal}
.promo p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:17px}
.perks{display:flex;flex-direction:column;gap:13px;margin-bottom:19px}
.perk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;font-weight:600}
.perk i{width:30px;height:30px;flex-shrink:0;border-radius:10px;background:var(--blue-gl);
  border:1px solid rgba(80,170,240,.3);display:grid;place-items:center;font-style:normal;font-size:14px}
.perk small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.5}
.codebox{background:var(--bg);border:1px dashed var(--line-2);border-radius:12px;padding:13px;margin-bottom:15px}
.codebox .cd{font-family:'Poppins';font-weight:800;font-size:21px;color:var(--blue);
  letter-spacing:.1em;margin-top:5px}
.price{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.price .p{font-family:'Poppins';font-weight:800;font-size:34px;letter-spacing:-.02em}
.price .per{color:var(--muted);font-size:13px}

/* ═══════ SPIELTAGE ═══════ */
.days{display:flex;gap:6px;overflow-x:auto;padding:11px 12px;background:var(--bg);
  border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:19;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:40px;background:var(--raise);border:1px solid var(--line);
  border-radius:10px;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px}
.days button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#04121F}
.days button.done{opacity:.4}

/* ═══════ BUDGET ═══════ */
.budget{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:14px}
.budget .lb{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--raise);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.budget .nm{font-family:'Poppins';font-weight:700;font-size:14px;color:var(--blue)}

/* ═══════ SPIELKARTE ═══════ */
.match{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:11px}
.match.headline{border-color:#D4AF6A;box-shadow:0 0 0 1px rgba(212,175,106,.35)}
.src.headtag{margin-left:0;background:rgba(212,175,106,.16);border-color:#D4AF6A;color:#D4AF6A}
.mtop{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.src{margin-left:auto;font-size:9.5px;padding:3px 7px;border-radius:20px;font-weight:700;
  background:var(--raise);border:1px solid var(--line-2)}
.src.mkt{background:var(--blue-gl);border-color:rgba(80,170,240,.3);color:var(--blue)}
.who{font-family:'Poppins';font-weight:600;font-size:15.5px;margin:10px 0 13px;line-height:1.35}
.who em{font-style:normal;color:var(--muted);font-weight:400}
.odds{display:flex;gap:7px}
.odds button{flex:1;background:var(--raise);border:1px solid var(--line-2);border-radius:12px;
  padding:10px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .13s}
.odds .sd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.odds .q{font-family:'Poppins';font-size:16px;font-weight:700;letter-spacing:-.02em}
.odds button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#04121F}
.odds button[aria-pressed="true"] .sd{color:rgba(4,18,31,.7)}
.odds button.win{border-color:var(--win)}

/* ═══════ ERGEBNIS ═══════ */
.exact{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.exhead{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;font-weight:600;
  color:var(--blue);padding:3px 0}
.exhead .cr{margin-left:auto;transition:transform .18s;font-size:13px}
.exhead[aria-expanded="true"] .cr{transform:rotate(90deg)}
.exlock{display:flex;align-items:center;gap:11px;width:100%;text-align:left}
.exlock .t{flex:1}
.exlock b{font-size:13px;font-weight:600;display:block}
.exlock small{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.grid button{background:var(--raise);border:1px solid var(--line-2);border-radius:10px;
  padding:8px 2px;display:flex;flex-direction:column;gap:2px;align-items:center}
.grid .s{font-family:'Poppins';font-size:13px;font-weight:700}
.grid .o{font-size:10px;color:var(--muted);font-weight:500}
.grid button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#04121F}
.grid button[aria-pressed="true"] .o{color:rgba(4,18,31,.7)}
.axis{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin-top:11px}

/* ═══════ EINSATZ ═══════ */
.stake{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line)}
.stake input[type=range]{flex:1;accent-color:var(--blue);height:20px}
.stake .v{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}
.stake .v b{color:var(--blue);font-weight:700}
.match.hit{border-color:rgba(52,211,153,.45)}
.match.miss{opacity:.5}
.res{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line);font-size:12px;font-weight:500}
.res .pt{font-family:'Poppins';font-size:15px;font-weight:700}
.hit .pt{color:var(--win)}.miss .pt{color:var(--muted)}
.tend{background:var(--blue-gl);border:1px solid rgba(80,170,240,.3);border-radius:6px;
  padding:2px 7px;font-size:10px;font-weight:700;color:var(--blue);margin-left:6px}

/* ═══════ TABELLE ═══════ */
.rank{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:8px}
.rank.lead{border-color:rgba(80,170,240,.4);background:linear-gradient(100deg,var(--blue-gl),var(--card) 55%)}
.rank .ps{font-family:'Poppins';font-weight:700;font-size:14px;width:20px;color:var(--muted)}
.rank.lead .ps{color:var(--blue)}
.rank .nm{flex:1;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .dl{font-size:11.5px;font-weight:700;color:var(--win);opacity:0;transition:opacity .3s}
.rank .dl.on{opacity:1}
.rank .pts{font-family:'Poppins';font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.rank.me .nm::after{content:'DU';font-size:9px;background:var(--blue);color:#04121F;padding:2px 6px;
  border-radius:6px;margin-left:8px;vertical-align:1px;font-weight:700}

/* ═══════ CHAT ═══════ */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;display:flex;flex-direction:column;gap:4px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;
  font-size:14px;line-height:1.4}
.msg.mine .bub{background:var(--blue);border-color:var(--blue);color:#04121F}
.msg .au{font-size:10.5px;font-weight:600;color:var(--muted);padding:0 5px}
.stk{font-size:50px;line-height:1}
.stk.word{font-family:'Poppins';font-weight:800;font-size:26px;background:var(--blue-gl);
  border:1px solid rgba(80,170,240,.35);color:var(--blue);padding:9px 17px;border-radius:14px;
  letter-spacing:.02em}
.composer{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--bg);
  border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:8px;z-index:31}
.composer input{flex:1;min-width:0;border-radius:12px;padding:12px 14px}
.composer button{width:46px;flex-shrink:0;border-radius:12px;background:var(--blue);color:#04121F;
  font-size:17px;display:grid;place-items:center}
.composer button.gh{background:var(--raise);border:1px solid var(--line-2);color:var(--text)}
.picker{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--bg);
  border-top:1px solid var(--line);z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  gap:9px;padding:15px 12px calc(82px + env(safe-area-inset-bottom))}
.picker button{aspect-ratio:1;border:1px solid var(--line-2);border-radius:14px;background:var(--raise);
  font-size:28px;display:grid;place-items:center}
.picker button.w{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--blue);
  background:var(--blue-gl);border-color:rgba(80,170,240,.3)}

/* ═══════ AUSWAHL / ANFRAGE ═══════ */
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:17px;margin-bottom:11px;display:block;transition:all .15s}
.opt:active{border-color:var(--blue);transform:scale(.99)}
.opt b{display:block;font-family:'Poppins';font-size:16px;font-weight:700;margin-bottom:6px}
.opt p{font-size:12.5px;color:var(--muted);line-height:1.6}
.opt .pill{margin-bottom:10px}
.toggle{display:flex;gap:8px;margin-top:8px}
.toggle button{flex:1;background:var(--raise);border:1px solid var(--line-2);border-radius:12px;
  padding:12px 8px;text-align:center}
.toggle button[aria-pressed="true"]{background:var(--blue-gl);border-color:var(--blue);color:var(--blue)}
.toggle .t{display:block;font-size:13.5px;font-weight:600}
.toggle .d{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.toggle button[aria-pressed="true"] .d{color:rgba(80,170,240,.75)}
.reqrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px;margin-bottom:9px}
.reqrow .nm{flex:1;font-size:14px;font-weight:500}
.mini{padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600}
.mini.ok{background:var(--blue);color:#04121F}
.mini.no{background:var(--raise);border:1px solid var(--line-2);color:var(--muted)}

/* ═══════ RECHTSTEXTE ═══════ */
.legal{font-size:13.5px;line-height:1.72;color:#C3CAD2}
.legal h3{font-family:'Poppins';font-size:15px;font-weight:700;color:var(--text);margin:24px 0 9px}
.legal h3:first-child{margin-top:0}
.legal p{margin-bottom:11px}
.legal ul{margin:0 0 11px 18px}
.legal li{margin-bottom:6px}
.legal .ph{color:var(--warn);font-weight:600}
.banner{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);border-radius:12px;
  padding:13px;font-size:12.5px;line-height:1.6;color:#E8D5A8;margin-bottom:20px}

/* ═══════ AKTIONSLEISTE ═══════ */
.dock{position:fixed;bottom:0;width:100%;max-width:480px;z-index:15;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--surface) 62%,transparent)}
.dockmsg{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function compTag(r,kurz){

}

/* ══════════ POISSON (Ersatzquoten + Simulation) ══════════ */
const pois=(k,l)=>{let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-l)*l**k/f;};
const mtx=(lh,la,m=6)=>{const o=[];for(let i=0;i<=m;i++){o[i]=[];
  for(let j=0;j<=m;j++)o[i][j]=pois(i,lh)*pois(j,la);}return o;};
function p1X2(m){let h=0,d=0,a=0;m.forEach((r,i)=>r.forEach((p,j)=>{i>j?h+=p:i<j?a+=p:d+=p}));
  const s=h+d+a;return{h:h/s,d:d/s,a:a/s};}
const price=(p,v)=>Math.max(1.01,Math.round((1-v)/p*100)/100);
function fitL(pH,pD,pA){let best=[1.4,1.1],err=9e9;
  for(let lh=.3;lh<=3.4;lh+=.1)for(let la=.25;la<=3;la+=.1){
    const p=p1X2(mtx(lh,la));const e=(p.h-pH)**2+(p.d-pD)**2+(p.a-pA)**2;
    if(e<err){err=e;best=[lh,la];}}return best;}
function fallbackMatch(m){
  const[ah,dh]=RATING[m.home]||[1.3,1.35],[aa,da]=RATING[m.away]||[1.3,1.35];
  const M=mtx(ah*da*.95,aa*dh*.8),p=p1X2(M),exact=[];
  for(let i=0;i<=3;i++)for(let j=0;j<=3;j++)
    exact.push({key:`${i}:${j}`,label:`${i}:${j}`,q:price(M[i][j],.16)});
  return{...m,sport:'fb',source:'mdl',exact,sides:[
    {key:'1',label:'1',q:price(p.h,.06)},{key:'X',label:'X',q:price(p.d,.06)},
    {key:'2',label:'2',q:price(p.a,.06)}]};
}

const net={data:'lade',updated:null,comps:[]};
/* Ergebnis: {bl1:[...], bl2:[...], ufc:[...]} — je Wettbewerb eine Liste. */
async function loadData(){
  try{
    const r=await fetch(CFG.dataUrl+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json();
    const ev={};
    if(Array.isArray(d.competitions)&&d.competitions.length){
      d.competitions.forEach(c=>{
        if(!COMPS[c.id]||!Array.isArray(c.matches)) return;
        ev[c.id]=c.matches.map(m=>({...m,sport:COMPS[c.id].sport,
          day:m.day||1,start:new Date(m.start)}));
      });
    }else{
      /* Ältere data.json ohne Wettbewerbsliste */
      if(Array.isArray(d.matches)&&d.matches.length)
        ev.bl1=d.matches.map(m=>({...m,sport:'fb',start:new Date(m.start)}));
      if(Array.isArray(d.fights)&&d.fights.length)
        ev.ufc=d.fights.map(f=>({...f,sport:'mma',day:1,start:new Date(f.start)}));
    }
    if(!Object.keys(ev).length) throw 0;
    net.data='live'; net.updated=d.updated?new Date(d.updated):null;
    net.comps=Object.keys(ev);
    return ev;
  }catch(e){
    net.data='offline'; net.comps=['bl1','bl2','ufc'];
    return{bl1:genPlan('bl1').map(fallbackMatch), bl2:genPlan('bl2').map(fallbackMatch),
           ufc:demoFights()};

function genPlan(comp='bl1'){
  const t=CLUBS[comp]||CLUBS.bl1,n=t.length,out=[],
    first=new Date('2026-08-28T20:30:00+02:00'),rot=t.slice(1);
  for(let d=0;d<34;d++){const half=d%17,back=d>=17;
    const ord=[t[0],...rot.slice(half).concat(rot.slice(0,half))];
    for(let i=0;i<n/2;i++){let h=ord[i],a=ord[n-1-i];
      if((i+d)%2)[h,a]=[a,h]; if(back)[h,a]=[a,h];
      out.push({id:`${comp}-g${d}-${i}`,day:d+1,home:h,away:a,
        start:new Date(first.getTime()+d*7*864e5+i*144e5)});}}
  return out;
}

function fireToLocal(id,d,uid){

    owner:d.ownerUid===uid?'me':(d.ownerName||d.ownerUid),members:membersArr,requests:[],chat:[]});
  r.results=d.results||{};
  r.picks=(d.picks&&d.picks[uid])||{};
  r.settled=d.settled||{};
  r.memberPicks=d.picks||{};
  r.fsId=id;r.ownerUid=d.ownerUid;r.memberUids=d.memberUids||[];

   Bundesliga und UFC kommen aus data.json. Eigene Ligen haben keine Datenquelle —
   dort trägt der Ersteller die Ergebnisse selbst ein.                          */
function eventResult(ev,r){
  if(r&&r.custom){
    const x=r.results[ev.id];
    if(!x) return null;
    const h=+x.h,a=+x.a;
    if(!isFinite(h)||!isFinite(a)) return null;
    return{side:h>a?'1':h<a?'2':'X',exact:`${h}:${a}`,text:`Endstand ${h}:${a}`,real:true};
  }
  if(!ev.finished) return null;
  if(ev.sport==='mma'){
    if(!ev.winner) return null;
    const w=ev.sides.find(x=>x.key===ev.winner);
    return{side:ev.winner,text:(w?w.label:'Sieger')+' gewinnt',real:true};
  }
  if(!ev.score) return null;
  const h=ev.score.h,a=ev.score.a;
  return{side:h>a?'1':h<a?'2':'X',exact:`${h}:${a}`,text:`Endstand ${h}:${a}`,real:true};
}
/* Nur wenn für JEDES Spiel ein Ergebnis vorliegt, wird gewertet. */
function allResults(evs,r){
  const out={};
  for(const ev of evs){const x=eventResult(ev,r);if(!x)return null;out[ev.id]=x;}
  return out;
}

/* ══════════ PUNKTE ══════════
   Tendenz richtig            → Einsatz × Quote
   Exaktes Ergebnis richtig   → Einsatz × Ergebnisquote (deutlich höher)
   Ergebnis falsch, Tendenz richtig → trotzdem Tendenzpunkte
   Eigene Ligen ohne Quoten   → fester Wert je Treffer                     */
function ptsFor(pick,res,ev){
  if(!res||!pick) return 0;
  if(ev&&ev.noOdds) return res.side===pick.side?CFG.amateurPts:0;
  if(pick.type==='exact'){
    if(res.exact===pick.side) return pick.stake*pick.q;
    const[h,a]=pick.side.split(':').map(Number);
    const tend=h>a?'1':h<a?'2':'X';
    if(tend===res.side) return pick.stake*(ev?.sides.find(s=>s.key===tend)?.q||1);
    return 0;
  }
  return res.side===pick.side?pick.stake*pick.q:0;
}
const scoreAll=(picks,res,evs)=>Object.entries(picks)
  .reduce((t,[id,p])=>t+ptsFor(p,res[id],evs.find(e=>e.id===id)),0);

function simulate(evs){
  const out={};
  evs.forEach(ev=>{
    if(ev.sport==='mma'||ev.noOdds){
      const w=ev.sides.map(s=>1/s.q),sum=w.reduce((a,b)=>a+b,0);
      let x=Math.random()*sum,win=ev.sides[0].key;
      for(const s of ev.sides){x-=1/s.q;if(x<=0){win=s.key;break;}}
      out[ev.id]={side:win,text:ev.sides.find(s=>s.key===win).label+' gewinnt'};
    }else{
      const q=Object.fromEntries(ev.sides.map(s=>[s.key,s.q]));
      const raw=[1/q['1'],1/q['X'],1/q['2']],sm=raw.reduce((a,b)=>a+b,0);
      const[lh,la]=fitL(...raw.map(r=>r/sm));
      const g=l=>{let k=0,p=Math.exp(-l),c=p,u=Math.random();
        while(u>c&&k<9){k++;p*=l/k;c+=p;}return k;};
      const h=g(lh),a=g(la);
      out[ev.id]={side:h>a?'1':h<a?'2':'X',exact:`${h}:${a}`,text:`Endstand ${h}:${a}`};
    }
  });
  return out;
}
function botPicks(evs){
  const p={};let rest=CFG.budget;
  const sel=[...evs].sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*4));
  sel.forEach((ev,i)=>{
    const st=i===sel.length-1?rest:Math.max(5,Math.round(rest/(sel.length-i)*(.6+Math.random()*.7)/5)*5);
    if(st>rest||st<=0)return;
    const ex=ev.exact&&Math.random()<.28;
    const o=ex?ev.exact:ev.sides,s=o[Math.floor(Math.random()*o.length)];
    p[ev.id]={side:s.key,q:s.q,stake:ev.noOdds?0:st,type:ex?'exact':'tendency'};
    rest-=ev.noOdds?0:st;
  });
  return p;
}

/* ─── Kopfzeile für Unterseiten ─── */
const head=(title,sub)=>`<header><div class="hrow">
  <button class="ico" id="back" aria-label="Zurück">‹</button>
  <div style="flex:1;min-width:0">
    ${sub?`<div class="hsub">${esc(sub)}</div>`:''}
    <div class="htitle">${esc(title)}</div></div>
</div></header>`;
const bindBack=(to='home')=>{const b=app.querySelector('#back');if(b)b.onclick=()=>go(to);};

/* ═══════════ PASSWORT ZURÜCKSETZEN (eigene Seite, per Mail-Link) ═══════════ */
function vResetPw(){
  app.innerHTML=`<div class="authwrap">
    ${MARK}
    <div class="authtag">Neues Passwort für dein Konto festlegen.</div>
    <label for="p1">Neues Passwort</label>
    <input type="password" id="p1" placeholder="Mindestens sechs Zeichen" autocomplete="new-password">
    <label for="p2">Passwort wiederholen</label>
    <input type="password" id="p2" placeholder="Nochmal eingeben" autocomplete="new-password">
    <div class="err" id="err"></div>
    <button class="btn" id="rpsub" style="margin-top:22px">Passwort speichern</button>
  </div>`;

  const err=app.querySelector('#err'),btn=app.querySelector('#rpsub');
  const fail=m=>{err.textContent=m;err.style.cssText='display:block';
    btn.disabled=false;btn.textContent='Passwort speichern';};

  const submit=async()=>{
    err.style.display='none';
    const p1=app.querySelector('#p1').value,p2=app.querySelector('#p2').value;
    if(!p1||p1.length<6) return fail('Das Passwort braucht mindestens sechs Zeichen.');
    if(p1!==p2) return fail('Die Passwörter stimmen nicht überein.');
    btn.disabled=true;btn.textContent='Einen Moment …';
    if(!FB) return fail('Da ist etwas schiefgelaufen. Versuch es später nochmal.');
    try{
      await FB.verifyPasswordResetCode(FB.auth,S.resetCode);
      await FB.confirmPasswordReset(FB.auth,S.resetCode,p1);
      app.innerHTML=`<div class="authwrap">
        ${MARK}
        <div class="authtag">Dein Passwort wurde geändert. Du kannst dich jetzt anmelden.</div>
        <button class="btn" id="toLogin" style="margin-top:22px">Zur Anmeldung</button>
      </div>`;
      app.querySelector('#toLogin').onclick=()=>{
        history.replaceState(null,'',location.pathname);
        S.screen='auth';S.authMode='login';render();
      };
    }catch(e){ fail('Dieser Link ist ungültig oder abgelaufen. Fordere einen neuen an.'); }
  };
  btn.onclick=submit;
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit();});
}

/* ═══════════ REGISTRIEREN / ANMELDEN ═══════════ */
function vAuth(){
  const reg=S.authMode==='register';
  app.innerHTML=`<div class="authwrap">
    ${MARK}
    <div class="authtag">Tippen mit Freunden — Bundesliga, 2. und 3. Liga,
      Champions League, UFC und deine eigene Runde.</div>
    <div class="seg">
      <button data-m="register" aria-selected="${reg}">Registrieren</button>
      <button data-m="login" aria-selected="${!reg}">Anmelden</button>
    </div>
    ${reg?`<label for="u">Nutzername</label>
      <input type="text" id="u" placeholder="Wie sollen dich andere sehen?" autocomplete="nickname">`:''}
    <label for="e">E-Mail</label>
    <input type="email" id="e" placeholder="du@beispiel.de" autocomplete="email" inputmode="email">
    <label for="p">Passwort</label>
    <input type="password" id="p" placeholder="Mindestens sechs Zeichen"
      autocomplete="${reg?'new-password':'current-password'}">
    ${!reg?'<button class="linklike" id="forgot" type="button" style="margin-top:8px">Passwort vergessen?</button>':''}
    <div class="err" id="err"></div>
    <button class="btn" id="sub" style="margin-top:22px">${reg?'Konto erstellen':'Anmelden'}</button>
    ${reg?`<p class="legalnote">Mit dem Erstellen eines Kontos stimmst du den
      <button data-l="agb">AGB</button> zu und bestätigst die
      <button data-l="datenschutz">Datenschutzerklärung</button> gelesen zu haben.</p>`
     :`<p class="legalnote">Noch kein Konto? Wechsle oben zu „Registrieren".</p>`}
    ${!FB_ON?`<p class="legalnote" style="margin-top:22px;color:#5C6672">
      Demo-Modus — es werden noch keine echten Konten gespeichert.</p>`:''}
  </div>`;

  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    S.authMode=b.dataset.m; render();});
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>
    go('legal',{flow:b.dataset.l}));

  const err=app.querySelector('#err'),btn=app.querySelector('#sub');
  const fail=m=>{err.textContent=m;err.style.display='block';
    btn.disabled=false;btn.textContent=reg?'Konto erstellen':'Anmelden';};

  const submit=async()=>{
    err.style.display='none';
    const email=app.querySelector('#e').value.trim();
    const pass=app.querySelector('#p').value;
    const name=reg?app.querySelector('#u').value.trim():'';
    if(reg&&!name) return fail('Bitte wähl einen Nutzernamen.');
    if(!email||!pass) return fail('Bitte E-Mail und Passwort ausfüllen.');
    if(reg&&pass.length<6) return fail('Das Passwort braucht mindestens sechs Zeichen.');
    btn.disabled=true;btn.textContent='Einen Moment …';
    if(!FB_ON){                                    // Demo-Modus
      await new Promise(r=>setTimeout(r,550));
      S.user={displayName:name||email.split('@')[0],email};
      ROUNDS.buli.members[0].name=S.user.displayName;
      ROUNDS.ufc.members[0].name=S.user.displayName;
      return go(reg?'welcome':'home');
    }
    try{
      if(reg){
        const uname=name.toLowerCase().replace(/\s+/g,'');
        if(uname.length<2) return fail('Der Nutzername muss mindestens zwei Zeichen haben.');
        const unameRef=FB.doc(FB.db,'usernames',uname);
        if((await FB.getDoc(unameRef)).exists())
          return fail('Dieser Nutzername ist schon vergeben. Wähl einen anderen.');

        const c=await FB.createUserWithEmailAndPassword(FB.auth,email,pass);
        try{
          await FB.setDoc(unameRef,{uid:c.user.uid,displayName:name});
        }catch(e){
          await FB.deleteUser(c.user).catch(()=>{});
          return fail('Dieser Nutzername wurde gerade eben vergeben. Wähl einen anderen.');
        }
        await FB.updateProfile(c.user,{displayName:name});
        S.user={displayName:name,email};
        go('welcome');
      }else{
        await FB.signInWithEmailAndPassword(FB.auth,email,pass);
      }
    }catch(e){ fail(authErr(e.code)); }
  };
  btn.onclick=submit;
  app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit();});

  const forgotBtn=app.querySelector('#forgot');
  if(forgotBtn) forgotBtn.onclick=async()=>{
    const email=app.querySelector('#e').value.trim();
    err.style.display='none';
    if(!email) return fail('Trag oben erst deine E-Mail-Adresse ein.');
    forgotBtn.disabled=true;forgotBtn.textContent='Einen Moment …';
    const done=()=>{ err.textContent='Falls zu dieser E-Mail ein Konto existiert, ist gerade eine Mail zum Zurücksetzen unterwegs. Schau notfalls auch im Spam-Ordner nach.';
      err.style.cssText='display:block;color:var(--muted)';
      forgotBtn.disabled=false;forgotBtn.textContent='Passwort vergessen?'; };
    if(!FB_ON) return done();
    try{ await FB.sendPasswordResetEmail(FB.auth,email); }
    catch(e){ console.warn('Passwort-Reset:',e.code,e.message); }
    done();
  };
}

function vJoin(){
  const t=S.joinTab;
  app.innerHTML=head('Runde beitreten','Tipoff')+`
  <nav>
    <button data-j="suchen" aria-selected="${t==='suchen'}">Öffentlich</button>
    <button data-j="code" aria-selected="${t==='code'}">Mit Code</button>
  </nav>
  <main>${t==='suchen'?joinSearch():joinCode()}</main>`;
  S.joinPrefill=null;S.joinPrefillErr=null;
  bindBack();
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{S.joinTab=b.dataset.j;render();});

  if(t==='suchen'){
    const q=app.querySelector('#q');
    if(q) q.oninput=()=>{
      const v=q.value.toLowerCase();
      app.querySelectorAll('[data-d]').forEach(el=>{
        el.style.display=el.dataset.name.includes(v)?'':'none';});
    };
    app.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>joinPublic(b.dataset.join));
    app.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>{
      b.disabled=true;b.textContent='Anfrage gesendet';b.className='mini no';
      toast('Anfrage gestellt — der Ersteller entscheidet');});
  }else{
    const inp=app.querySelector('#cd');
    const try_=async()=>{
      const v=inp.value.trim().toUpperCase();
      if(!v) return;
      const err=app.querySelector('#cerr');err.style.display='none';
      const hit=Object.values(ROUNDS).find(r=>r.code===v);
      if(hit&&hit.joined) return toast('Da bist du schon dabei');

      if(FB_ON&&FB){
        if(!needRoom())return;
        const btn=app.querySelector('#join');
        btn.disabled=true;btn.textContent='Einen Moment …';
        const res=await fsJoinByCode(v);
        btn.disabled=false;btn.textContent='Beitreten';
        if(res.error){ err.textContent=res.error;err.style.display='block';return; }
        toast('Runde beigetreten');
        return openRound(res.id||res.already);
      }
      if(hit&&!compFrei(hit.compId)){
        toast(COMPS[hit.compId].name+' gibt es mit Premium');return go('premium');}
      if(hit){ if(!needRoom())return;
        hit.joined=true;toast('Runde beigetreten');return openRound(hit.id);}
      /* Ein Code ist eine Einladung — damit geht auch eine private Runde auf. */
      const inv=DISCOVER.find(d=>d.code===v&&!ROUNDS[d.id]);
      if(inv) return joinPublic(inv.id);
      err.textContent='Zu diesem Code gibt es keine Runde. Tippfehler?';
      err.style.display='block';
    };
    app.querySelector('#join').onclick=try_;
    inp.onkeydown=e=>{if(e.key==='Enter')try_();};
  }
}

/* Runde auf einen offiziellen Wettbewerb — kein eigener Spielplan nötig. */
async function buildOfficial(d){
  const c=COMPS[d.compId];
  const name=(d.name||'').trim()||('Meine '+c.kurz+'-Runde');
  const rules=(d.rules||'').trim()||`Getippt wird auf ${c.name}. ${CFG.budget} Punkte je Spieltag, `+
      `Treffer zählen Einsatz mal Quote. Ergebnisse kommen automatisch.`;
  if(FB_ON&&FB){
    const id=await fsCreateRound({compId:d.compId,sport:c.sport,name,comp:c.name,
      rules,visibility:d.visibility});
    if(!id) return toast('Da ist etwas schiefgelaufen. Versuch es nochmal.');
    toast('Runde erstellt');openRound(id);return;
  }
  const id='o'+(++SEQ);
  ROUNDS[id]=mkRound({id,compId:d.compId,name,visibility:d.visibility,rules,
    members:[{id:'me',name:S.user?.displayName||'Du',pts:0}]});
  toast('Runde erstellt');
  openRound(id);
}

/* Spielplan kommt komplett vom Ersteller — kein automatisches Jeder-gegen-jeden.
   d.matchdays: [{date:'TT.MM.JJJJ'|'', pairings:[{home,away}]}] */
async function buildLeague(d){
  const idPrefix='c'+(++SEQ);
  const events=[];
  d.matchdays.forEach((md,mi)=>{
    const day=mi+1, base=parseDay(md.date)||new Date();
    md.pairings.filter(p=>p.home&&p.away&&p.home!==p.away).forEach((p,pi)=>{
      events.push({id:`${idPrefix}-${day}-${pi}`,day,home:p.home,away:p.away,
        sport:'fb',noOdds:true,source:'mdl',start:base,
        sides:[{key:'1',label:'1',q:1},{key:'X',label:'X',q:1},{key:'2',label:'2',q:1}]});
    });
  });
  const teams=d.teams.slice();
  const rules=`${teams.length} Teams, ${d.matchdays.length} Spieltag${d.matchdays.length>1?'e':''}. `+
    `Ohne Quoten — jeder Treffer ${CFG.amateurPts} Punkte.`;
  if(FB_ON&&FB){
    const id=await fsCreateRound({sport:'fb',name:d.name,custom:true,visibility:d.visibility,
      teams,events,rules});
    if(!id) return toast('Da ist etwas schiefgelaufen. Versuch es nochmal.');
    toast('Runde erstellt');openRound(id);return;
  }
  const id=idPrefix;
  ROUNDS[id]=mkRound({id,sport:'fb',name:d.name,custom:true,
    visibility:d.visibility,teams,events,rules,
    members:[{id:'me',name:S.user?.displayName||'Du',pts:0}]});
  toast('Runde erstellt');
  openRound(id);
}
function parseDay(s){
  const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(!m) return null;
  const y=+m[3]<100?2000+ +m[3]:+m[3], d=new Date(y,+m[2]-1,+m[1],19,0);
  return isNaN(d)?null:d;
}

function drawDays(){
  const el=app.querySelector('#days'),r=R(),mx=maxDay(r);
  el.innerHTML='';
  for(let d=1;d<=mx;d++){
    const b=document.createElement('button');
    b.textContent=d;b.setAttribute('aria-current',d===S.day);
    if(r.settled[d]||anyResult(eventsOf(r,d),r)) b.classList.add('done');
    b.onclick=()=>{S.day=d;render();};
    el.appendChild(b);

function matchCard(ev,isMain){
  const r=R(),p=r.picks[ev.id],st=settled();
  /* Ergebnis anzeigen, sobald es feststeht — auch ohne Auswertung. */
  const res=st?r.settled[dayKey()].results[ev.id]:eventResult(ev,r);
  /* Nach Anpfiff ist Schluss mit Tippen. */
  const zu=st||started(ev);
  const el=document.createElement('article');el.className='match'+(isMain?' headline':'');
  const nm=ev.sport==='mma'?[ev.home,ev.away]:[short(ev.home),short(ev.away)];
  el.innerHTML=`<div class="mtop">${ev.sport==='mma'?(isMain?'<span class="src headtag">Hauptkampf</span>':''):when(ev.start)}
    ${ev.noOdds?'<span class="src">Ohne Quoten</span>'
      :`<span class="src ${ev.source==='mkt'?'mkt':''}">${ev.source==='mkt'?'Marktquote':'Modell'}</span>`}</div>
    <div class="who">${esc(nm[0])} <em>${ev.sport==='mma'?'vs':'—'}</em> ${esc(nm[1])}</div>
    <div class="odds"></div>`;
  if(zu&&!st) el.querySelector('.mtop').insertAdjacentHTML('beforeend',
    `<span class="src" style="margin-left:0">${res?'Beendet':'Angepfiffen'}</span>`);

  const od=el.querySelector('.odds');
  ev.sides.forEach(s=>{
    const b=document.createElement('button');
    b.setAttribute('aria-pressed',!!(p&&p.type!=='exact'&&p.side===s.key));
    b.innerHTML=`<span class="sd">${esc(s.label)}</span>
      <span class="q">${ev.noOdds?'·':fq(s.q)}</span>`;
    if(!zu) b.onclick=()=>pick(ev,s,'tendency');
    else b.style.opacity=p&&p.side===s.key?'1':'.55';
    if(res&&res.side===s.key) b.classList.add('win');
    od.appendChild(b);
  });

  if(ev.exact&&ev.exact.length&&!zu){
    const w=document.createElement('div');w.className='exact';
    const best=fq(Math.max(...ev.exact.map(e=>e.q)));
    if(!S.premium){
      w.innerHTML=`<button class="exlock">
        <span class="pill b">★</span>
        <span class="t"><b>Genaues Ergebnis tippen</b>
          <small>Quoten bis ${best} statt ${fq(Math.max(...ev.sides.map(s=>s.q)))}</small></span>
        <span style="color:var(--blue)">›</span></button>`;
      w.querySelector('button').onclick=()=>go('premium');
    }else{
      const open=!!(p&&p.type==='exact');
      w.innerHTML=`<button class="exhead" aria-expanded="${open}">
        🎯 Genaues Ergebnis
        <span style="color:var(--muted);font-weight:500">bis ${best}</span>
        <span class="cr">›</span></button>
        <div class="box" style="display:${open?'block':'none'}">
          <div class="axis">${esc(nm[0])} : ${esc(nm[1])}</div>
          <div class="grid"></div>
          <p class="hint">Ergebnis daneben, aber Tendenz richtig? Dann gibt es
            trotzdem die Punkte der Siegwette.</p></div>`;
      const g=w.querySelector('.grid');
      ev.exact.forEach(s=>{
        const b=document.createElement('button');
        b.setAttribute('aria-pressed',!!(p&&p.type==='exact'&&p.side===s.key));
        b.innerHTML=`<span class="s">${s.label}</span><span class="o">${fq(s.q)}</span>`;
        b.onclick=()=>pick(ev,s,'exact');
        g.appendChild(b);
      });
      const hd=w.querySelector('.exhead'),bx=w.querySelector('.box');
      hd.onclick=()=>{const o=hd.getAttribute('aria-expanded')==='true';
        hd.setAttribute('aria-expanded',!o);bx.style.display=o?'none':'block';};
    }
    el.appendChild(w);
  }

  if(p&&!zu&&!ev.noOdds){
    const s=document.createElement('div');s.className='stake';
    const mx=Math.min(CFG.budget,p.stake+left());
    s.innerHTML=`<input type="range" min="5" max="${mx}" step="5" value="${p.stake}" aria-label="Einsatz">
      <span class="v"><b>${p.stake} P</b> → ${fmt(p.stake*p.q)} P</span>`;
    const i=s.querySelector('input');
    i.oninput=e=>{p.stake=+e.target.value;
      s.querySelector('.v').innerHTML=`<b>${p.stake} P</b> → ${fmt(p.stake*p.q)} P`;};
    i.onchange=()=>{r.pendingSync=r.pendingSync||{};r.pendingSync[ev.id]=true;render();};
    el.appendChild(s);
  }

  if(res&&p){
    const pts=ptsFor(p,res,ev),hit=pts>0;
    const exactHit=p.type==='exact'&&res&&res.exact===p.side;
    el.classList.add(hit?'hit':'miss');
    const d=document.createElement('div');d.className='res';
    d.innerHTML=`<span style="color:var(--muted)">${esc(res?.text||'—')}
      ${hit&&p.type==='exact'&&!exactHit?'<span class="tend">Tendenz</span>':''}</span>
      <span class="pt">${hit?'+'+fmt(pts):'0,0'} P</span>`;
    el.appendChild(d);
  }else if(res){
    const d=document.createElement('div');d.className='res';
    d.innerHTML=`<span style="color:var(--muted)">${esc(res.text)}</span>
      <span class="pt" style="color:var(--muted)">nicht getippt</span>`;
    el.appendChild(d);
  }
  return el;
}
function pick(ev,s,type){
  const r=R(),cur=r.picks[ev.id];
  if(cur&&cur.type===type&&cur.side===s.key) delete r.picks[ev.id];
  else if(cur) Object.assign(cur,{side:s.key,q:s.q,type});
  else{
    if(!ev.noOdds&&left()<5) return toast('Budget aufgebraucht');
    r.picks[ev.id]={side:s.key,q:s.q,type,stake:ev.noOdds?0:Math.min(10,left())};
  }
  r.pendingSync=r.pendingSync||{};r.pendingSync[ev.id]=true;
  render();
}
/* Erst beim Antippen von "Tipps abgeben" werden die Tipps wirklich gespeichert. */
async function submitPicks(){
  const r=R(),ids=Object.keys(r.pendingSync||{});
  if(!ids.length) return;
  const btn=app.querySelector('#submitPicks');
  if(btn){btn.disabled=true;btn.textContent='Einen Moment …';}
  for(const id of ids) await fsSyncPick(r,id);
  r.pendingSync={};
  toast('Tipps abgegeben');
  render();
}

function tabEntry(){

  b.innerHTML=`<p class="hint" style="margin:0 3px 16px">

      Sobald alle Spiele eines Spieltags eingetragen sind, werden die Punkte

    ${evs.map(ev=>{
      const x=r.results[ev.id]||{};
      return `<div class="card" style="margin-bottom:10px">
        <div class="mtop">${when(ev.start)}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:11px">

  app.querySelector('#foot').innerHTML=`<div class="dock">

  const lesen=()=>{

      const a=b.querySelector(`[data-a="${ev.id}"]`).value.replace(/\D/g,'');
      if(h!==''&&a!=='') r.results[ev.id]={h:+h,a:+a};
      else delete r.results[ev.id];

  b.querySelectorAll('input').forEach(i=>i.oninput=()=>{
    i.value=i.value.replace(/\D/g,'');
    lesen();
    app.querySelector('#cnt').textContent=`${evs.length-fehlt()} von ${evs.length} eingetragen`;
  });
  app.querySelector('#sv').onclick=async()=>{
    lesen();
    if(fehlt()) return toast(`Noch ${fehlt()} Ergebnis${fehlt()>1?'se':''} offen`);
    await fsSyncResults(r);
    const n=autoSettle();
    toast(n?'Gewertet — Punkte verteilt':'Gespeichert');
    S.tab=n?'tabelle':'tippen';render();
  };
}

function tabTable(){
  const r=R(),rows=[...r.members].sort((a,b)=>b.pts-a.pts);
  const evs=orderEvents(pool());

  /* Tipps eines Mitglieds — bei mir die eigenen (live), sonst die gespeicherten. */
  const picksOf=m=>m.id==='me'?r.picks:((r.memberPicks&&r.memberPicks[m.id])||{});
  /* Vor Anpfiff nur ein Strich (Tipp abgegeben, aber geheim). Danach: worauf getippt wurde,
     grün bei Treffer, rot bei Niete — sobald das Ergebnis feststeht.               */
  const cellFor=(m,ev)=>{
    const p=picksOf(m)[ev.id];
    if(!p) return '';
    if(!started(ev)) return '–';
    const label=p.type==='exact'&&S.premium?esc(p.side):tendAbbr(p,ev);
    const res=eventResult(ev,r);
    if(!res) return label;                 // läuft noch, Ergebnis noch nicht da
    const tend=p.type==='exact'?scoreTend(p.side):p.side;
    return `<span style="color:${tend===res.side?'var(--win)':'var(--bad)'}">${label}</span>`;
  };
  const matchTable=evs.length?`
    <div style="overflow-x:auto;margin-bottom:20px;-webkit-overflow-scrolling:touch">
      <table style="border-collapse:collapse;font-size:12px;white-space:nowrap">
        <thead><tr>
          <th style="position:sticky;left:0;background:var(--surface);padding:0 12px 8px 0"></th>
          ${evs.map(ev=>`<th style="padding:0 10px 8px;font-weight:600;color:var(--muted)">
            ${esc(teamAbbr(ev.home,ev))}–${esc(teamAbbr(ev.away,ev))}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.map(m=>`<tr>
          <td style="position:sticky;left:0;background:var(--surface);padding:7px 12px 7px 0;
            font-weight:600">${esc(m.name)}</td>
          ${evs.map(ev=>`<td style="text-align:center;padding:7px 10px;color:var(--muted)">
            ${cellFor(m,ev)}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table>
    </div>`:'';

  app.querySelector('#body').innerHTML=matchTable+rows.map((m,i)=>`
    <div class="rank${i===0?' lead':''}${m.id==='me'?' me':''}">
      <span class="ps">${i+1}</span>
      <span class="nm">${esc(m.name)}</span>
      <span class="dl" data-d="${m.id}"></span>
      <span class="pts" data-p="${m.id}">${fmt(m.pts)}</span></div>`).join('')+
    `<p class="hint" style="text-align:center;margin-top:16px">
      Jede Runde wird getrennt gewertet.</p>`;
  app.querySelector('#foot').innerHTML='';
}
/* Tendenz-Kürzel für die Tipp-Tabelle: erste Seite, zweite Seite oder X.
   Bei Fußball sind die Seiten '1'/'X'/'2', bei UFC 'A'/'B' — deshalb nicht
   fest auf '1' prüfen, sondern gegen die tatsächliche erste Quote der Partie. */
function tendAbbr(p,ev){
  const key=p.type==='exact'?scoreTend(p.side):p.side;
  if(key==='X') return 'X';
  const homeKey=ev.sides[0].key;
  return key===homeKey?teamAbbr(ev.home,ev):teamAbbr(ev.away,ev);
}
/* Kürzel aus dem Namen — bei UFC vom Nachnamen (letztes Wort), sonst vom Vereinsnamen. */
function teamAbbr(name,ev){ return abbr(ev.sport==='mma'?name.split(' ').pop():name); }
/* Tendenz ('1'/'X'/'2') aus einem exakten Ergebnis wie "2:1" ableiten. */
function scoreTend(s){
  const[h,a]=s.split(':').map(Number);
  return h>a?'1':h<a?'2':'X';
}

function drawDock(){
  const f=app.querySelector('#foot'),r=R(),k=dayKey(),evs=pool(),own=r.owner==='me';

  /* Bereits gewertet */
  if(r.settled[k]){
    const real=r.settled[k].real;
    f.innerHTML=`<div class="dock">
      <div class="dockmsg">${real?'Ausgewertet':'Probelauf'} · +${fmt(r.settled[k].me)} Punkte für dich</div>
      ${real?'':'<button class="btn ghost" id="rs">Probelauf zurücksetzen</button>'}</div>`;
    const rs=f.querySelector('#rs');
    if(rs) rs.onclick=()=>{
      const x=r.settled[k];r.members.forEach(m=>m.pts-=x.gain[m.id]||0);
      delete r.settled[k];evs.forEach(e=>delete r.picks[e.id]);render();};
    return;
  }

  /* Eigene Liga: der Ersteller muss die Ergebnisse eintragen */
  if(r.custom){
    const fehlt=evs.filter(e=>!eventResult(e,r)).length;
    if(fehlt&&own){
      f.innerHTML=`<div class="dock">
        <div class="dockmsg">${fehlt} von ${evs.length} Ergebnissen fehlen noch</div>
        <button class="btn" id="ent">Ergebnisse eintragen</button></div>`;
      f.querySelector('#ent').onclick=()=>{S.tab='ergebnis';render();};
      return;
    }
    if(fehlt){
      f.innerHTML=`<div class="dock"><div class="dockmsg">
        Warte auf die Ergebnisse — die trägt ${esc(r.owner==='me'?'du':'der Ersteller der Runde')} ein.
        </div></div>`;
      return;
    }
  }

  /* Alle Ergebnisse da, aber noch nicht getippt worden */
  const n=dayPicks().length;
  if(allResults(evs,r)&&!n){
    f.innerHTML=`<div class="dock"><div class="dockmsg">
      Ergebnisse liegen vor — für diesen Spieltag hast du nicht getippt.</div></div>`;
    return;
  }

  /* Noch offen: Tippen läuft */
  const frei=r.custom,offen=evs.filter(e=>!started(e)).length;
  const pend=Object.keys(r.pendingSync||{}).filter(id=>evs.some(e=>e.id===id)).length;
  if(n&&pend){
    f.innerHTML=`<div class="dock">
      <button class="btn" id="submitPicks">${n} Tipp${n>1?'s':''} abgeben</button>
      ${!frei&&left()>0?`<p class="hint" style="text-align:center;margin-top:9px;font-size:11.5px">
        noch ${left()} P übrig</p>`:''}</div>`;
    f.querySelector('#submitPicks').onclick=submitPicks;
    return;
  }
  f.innerHTML=`<div class="dock">
    <div class="dockmsg">${n
      ?(frei?`${n} Tipp${n>1?'s':''} abgegeben`
             :`${n} Tipp${n>1?'s':''} abgegeben${left()>0?` · noch ${left()} P übrig`:''}`)
      :offen?'Tipp auf eine Quote, dann Einsatz mit dem Regler wählen'
             :'Für diesen Spieltag ist die Tippfrist vorbei'}</div></div>`;
}
/* Punkte gutschreiben — einmal je Spieltag.
   Bei echten (Firestore-)Runden zählen die wirklich abgegebenen Tipps aller Mitglieder.
   Bei den fest im Code stehenden Demo-Runden (ohne fsId) simulieren Bot-Tipps die anderen. */
function applySettle(r,k,evs,res,picks,real){
  const gain={};
  r.members.forEach(m=>{
    if(r.fsId){
      const uid=m.id==='me'?myUid():m.id;
      const theirs=m.id==='me'?picks:((r.memberPicks&&r.memberPicks[uid])||{});
      gain[m.id]=scoreAll(theirs,res,evs);
    }else{
      gain[m.id]=m.id==='me'?scoreAll(picks,res,evs):scoreAll(botPicks(evs),res,evs);
    }
  });
  r.members.forEach(m=>m.pts+=gain[m.id]||0);
  r.settled[k]={results:res,gain,me:gain.me,real:!!real};
  fsSyncSettle(r,k);
  return gain;
}

/* Auswertung von Hand — nur als Probelauf, solange keine echten Ergebnisse da sind. */
function settleDay(){
  const r=R(),evs=pool(),k=dayKey();
  const real=allResults(evs,r);
  const res=real||simulate(evs);
  const gain=applySettle(r,k,evs,res,Object.fromEntries(dayPicks()),!!real);
  S.tab='tabelle';render();rollUp(gain);
}

/* ══════════ AUTOMATISCHE AUSWERTUNG ══════════
   Läuft nach jedem Datenabruf: Sobald für einen Spieltag alle Ergebnisse
   vorliegen und du getippt hast, werden die Punkte von selbst gutgeschrieben. */
function autoSettle(){
  let n=0;
  Object.values(ROUNDS).forEach(r=>{
    if(!r.joined) return;
    const days = r.custom ? [...new Set(r.events.map(e=>e.day))]
               : r.sport==='mma' ? [1]
               : [...new Set(evOf(r.compId).map(m=>m.day||1))];
    days.forEach(d=>{
      if(r.settled[d]) return;
      const evs=eventsOf(r,d); if(!evs.length) return;
      const res=allResults(evs,r); if(!res) return;
      const picks=Object.fromEntries(
        Object.entries(r.picks).filter(([id])=>evs.some(e=>e.id===id)));
      if(!Object.keys(picks).length) return;      // nichts getippt, nichts zu werten
      applySettle(r,d,evs,res,picks,true); n++;
    });
  });
  return n;
}
function rollUp(gain){
  app.querySelectorAll('[data-p]').forEach(el=>{
    const id=el.dataset.p,to=R().members.find(m=>m.id===id).pts,g=gain[id]||0,from=to-g;
    const dl=app.querySelector(`[data-d="${id}"]`),t0=performance.now();
    (function step(t){
      const k=Math.min(1,(t-t0)/950),e=1-(1-k)**3;
      el.textContent=fmt(from+(to-from)*e);
      if(k<1) requestAnimationFrame(step);
      else{el.textContent=fmt(to);if(dl&&g){dl.textContent='+'+fmt(g);dl.classList.add('on');}}
    })(t0);
  });
}

    </div>
    <div class="legal">${L.h}</div>
  </main>`;
  const b=app.querySelector('#back');
  b.onclick=()=>go(S.user?'home':'auth');
}

/* ══════════ START ══════════ */
(async()=>{
  const sp=document.getElementById('splash'),vid=document.getElementById('vid'),
        sm=document.getElementById('smark');
  let vidOk=false,hidden=false;
  const hide=()=>{ if(hidden)return; hidden=true;
    sp.classList.add('gone'); setTimeout(()=>sp.remove(),600); };

  vid.src=CFG.intro;
  vid.addEventListener('canplay',()=>{
    vidOk=true;vid.classList.add('on');vid.play().catch(()=>{});},{once:true});
  vid.addEventListener('ended',hide,{once:true});
  sp.addEventListener('click',hide);          // Antippen überspringt

  const [d,fb]=await Promise.all([loadData(),initAuth()]);
  S.ev=d;S.ready=true;
  autoSettle();          // fertige Spieltage sofort verrechnen

  if(fb){
    FB=fb;let last;
    FB.onAuthStateChanged(FB.auth,async u=>{
      const uid=u?u.uid:null;
      S.user=u?{displayName:u.displayName||u.email.split('@')[0],email:u.email}:null;
      if(uid!==last){
        last=uid;
        if(S.screen!=='resetpw'){
          if(u&&S.screen!=='welcome') S.screen='home';
          if(!u) S.screen='auth';
        }
        if(u){
          /* Demo-Runden weichen den echten, sobald jemand eingeloggt ist. */
          Object.keys(ROUNDS).forEach(k=>delete ROUNDS[k]);
          render();
          await fsLoadMyRounds();
          await tryPendingJoin();
        }
      }
      render();
    });
  }else{ await tryPendingJoin(); render(); }

  /* Dem Video bis zu 3,5s Zeit zum Laden geben. Läuft es, darf es bis zu 4,5s weiterlaufen
     oder natürlich zu Ende spielen ("ended"). Läuft es nicht, kurz das Standbild zeigen,
     statt sofort auf schwarz zu springen. */
  setTimeout(()=>{
    if(vidOk){ setTimeout(hide,4500); }
    else{ sm.classList.add('show'); setTimeout(hide,900); }
  },3500);
})();
</script>
</body>
